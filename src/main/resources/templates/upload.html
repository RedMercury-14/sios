<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка фото</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-label {
            display: inline-block;
            padding: 15px 25px;
            background-color: #007bff;
            color: white;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-btn {
            padding: 15px 25px;
            background-color: #28a745;
            color: white;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .upload-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-size: 1.1em;
        }

        progress {
            width: 100%;
            height: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>Загрузите фото</h1>
<p>Зайдите с телефона по ссылке: <a th:href="'http://' + ${ipAddress} + ':8080/'" th:text="'http://' + ${ipAddress} + ':8080/'"></a></p>

<label class="custom-file-label" for="fileInput">Выбрать фото</label>
<input type="file" id="fileInput" multiple accept="image/*">

<br>
<button class="upload-btn" id="uploadBtn" disabled>Загрузить</button>

<div id="status"></div>
<progress id="progressBar" value="0" max="100" style="display:none;"></progress>

<button class="upload-btn" id="stopAppBtn" style="background-color: #dc3545;">Остановить приложение</button>


<script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    let files = [];

    fileInput.addEventListener('change', () => {
        files = Array.from(fileInput.files);
        status.innerText = `${files.length} фото выбрано`;
        uploadBtn.disabled = files.length === 0;
    });

    uploadBtn.addEventListener('click', async () => {
        if (files.length === 0) return;

        let uploaded = 0;
        progressBar.style.display = 'block';
        progressBar.value = 0;
        progressBar.max = files.length;

        for (let i = 0; i < files.length; i++) {
            const formData = new FormData();
            formData.append('file', files[i]);

            try {
                await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                uploaded++;
                status.innerText = `Загружено ${uploaded} из ${files.length}`;
                progressBar.value = uploaded;
            } catch (e) {
                status.innerText = `Ошибка при загрузке файла: ${files[i].name}`;
                break;
            }
        }

        if (uploaded === files.length) {
            status.innerText = 'Все фото успешно загружены!';
        }
    });
    
    const stopAppBtn = document.getElementById('stopAppBtn');

    stopAppBtn.addEventListener('click', async () => {
        if (confirm('Вы уверены, что хотите остановить приложение?')) {
            try {
                await fetch('/stopApp', { method: 'POST' });
                alert('Приложение будет остановлено.');
            } catch (e) {
                alert('Ошибка при попытке остановить приложение');
            }
        }
    });
</script>

</body>
</html>
